services:
  - type: web
    name: nura-api
    runtime: node
    rootDir: server
    buildCommand: npm ci && npm run db:generate && npm run db:deploy
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nura-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://nura-web.onrender.com
      - key: APP_URL
        value: https://nura-web.onrender.com

  - type: web
    name: nura-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://nura-api.onrender.com/api/v1

databases:
  - name: nura-db
    databaseName: nura
    user: nura_app
    plan: basic-256mb
