services:
  - type: web
    name: nura-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run db:generate && npm run db:deploy
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
